<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Monthly remote health check{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Monthly remote health check</a>
      <nav class="topnav">
        <a href="/">Clients</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% if err %}
    <div class="banner error" role="alert">{{ err }}</div>
    {% endif %}
    {% if msg %}
    <div class="banner ok" role="status">{{ msg }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Internal tool, no login. LAN or VPN only. A check is what you saw at that time, not live monitoring.</p>
  </footer>
  <div id="lightbox" class="lightbox" hidden>
    <button type="button" class="lightbox-close" data-close-lightbox>Close</button>
    <img alt="">
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
