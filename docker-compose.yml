services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      TZ: Asia/Hong_Kong
    volumes:
      - healthcheck-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  healthcheck-data:
